<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Input Order - OMI</title>
<link rel="icon" type="image/png" href="favicon.png">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#F4F5F3;--surface:#fff;--ink:#141B22;--ink-2:#5B6472;--ink-3:#8A93A0;--line:#E1E4E2;--line-soft:#EDEEEC;--teal:#fe3a04;--teal-soft:rgba(254,58,4,.12);--amber:#9C6B12;--amber-soft:#FBF1DE;--grey-soft:#EEEEEC;--radius:10px;--success:#16a34a;--success-light:rgba(22,163,74,.1);--danger:#dc2626;--danger-light:rgba(220,38,38,.1)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.6}
.container{max-width:1400px;margin:0 auto;padding:24px}
.header{display:flex;align-items:center;justify-content:space-between;padding:16px 0;margin-bottom:32px;border-bottom:1px solid var(--line)}
.header-brand{display:flex;align-items:center;gap:12px}
.header-logo{width:40px;height:40px;background:var(--teal);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff}
.header-title{font-size:18px;font-weight:700}
.header-subtitle{font-size:12px;color:var(--ink-3)}
.steps{display:flex;gap:8px;margin-bottom:32px;overflow-x:auto;padding-bottom:4px}
.step-item{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--ink-3);white-space:nowrap;transition:all .3s}
.step-item.active{background:var(--teal-soft);border-color:var(--teal);color:var(--teal)}
.step-item.done{background:var(--success-light);border-color:var(--success);color:var(--success)}
.step-num{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--line);color:var(--ink-3)}
.step-item.active .step-num{background:var(--teal);color:#fff}
.step-item.done .step-num{background:var(--success);color:#fff}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-bottom:20px}
.card-title{font-size:16px;font-weight:700;margin-bottom:4px}
.card-desc{font-size:13px;color:var(--ink-3);margin-bottom:16px}
.upload-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.upload-box{border:2px dashed var(--line);border-radius:var(--radius);padding:24px;text-align:center;cursor:pointer;transition:all .3s;position:relative;background:var(--surface)}
.upload-box:hover,.upload-box.dragover{border-color:var(--teal);background:var(--teal-soft)}
.upload-box.uploaded{border-color:var(--success);background:var(--success-light)}
.upload-box .upload-icon{font-size:32px;margin-bottom:8px}
.upload-box .upload-label{font-size:14px;font-weight:600}
.upload-box .upload-hint{font-size:12px;color:var(--ink-3);margin-top:4px}
.upload-box .upload-file{font-size:12px;color:var(--success);margin-top:8px;word-break:break-all}
.upload-box input[type="file"]{display:none}
.upload-badge{position:absolute;top:8px;right:8px;font-size:10px;padding:2px 8px;border-radius:10px;background:var(--danger-light);color:var(--danger);font-weight:600}
.upload-box.uploaded .upload-badge{background:var(--success-light);color:var(--success)}
.input-group{margin-bottom:16px}
.input-label{font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:6px;display:block;text-transform:uppercase;letter-spacing:.5px}
.input-field{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);color:var(--ink);font-size:14px;outline:none;transition:border-color .3s}
.input-field:focus{border-color:var(--teal)}
.input-field::placeholder{color:var(--ink-3)}
.btn{padding:12px 24px;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .3s;display:inline-flex;align-items:center;gap:8px}
.btn-primary{background:var(--teal);color:#fff}
.btn-primary:hover{background:#e53504;transform:translateY(-1px)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-secondary{background:var(--grey-soft);color:var(--ink);border:1px solid var(--line)}
.btn-secondary:hover{background:var(--line-soft)}
.btn-sm{padding:6px 12px;font-size:12px}
.table-wrapper{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--bg);padding:10px 12px;text-align:left;font-weight:600;color:var(--ink-2);white-space:nowrap;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
td{padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle;color:var(--ink)}
tr:hover td{background:var(--grey-soft)}
tr.row-danger td{background:var(--danger-light)}
tr.row-warning td{background:var(--amber-soft)}
tr.row-free td{background:var(--teal-soft);font-style:italic}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600}
.badge-success{background:var(--success-light);color:var(--success)}
.badge-danger{background:var(--danger-light);color:var(--danger)}
.badge-warning{background:var(--amber-soft);color:var(--amber)}
.promo-tag{font-size:11px;padding:2px 8px;border-radius:4px;background:var(--teal-soft);color:var(--teal);display:inline-block;margin-top:4px}
.section{display:none}
.section.active{display:block}
.alert{padding:12px 16px;border-radius:var(--radius);font-size:13px;margin-bottom:16px}
.alert-error{background:var(--danger-light);color:var(--danger);border:1px solid var(--danger)}
.alert-warning{background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber)}
.alert-success{background:var(--success-light);color:var(--success);border:1px solid var(--success)}
.search-box{position:relative;margin-bottom:16px}
.search-box input{padding-left:36px}
.search-box::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px}
.summary-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px}
.summary-item{background:var(--bg);border-radius:var(--radius);padding:14px;text-align:center;border:1px solid var(--line)}
.summary-item .label{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.5px}
.summary-item .value{font-size:20px;font-weight:700;margin-top:4px}
.toggle-wrapper{display:flex;align-items:center;gap:8px}
.toggle{width:36px;height:20px;border-radius:10px;background:var(--line);cursor:pointer;position:relative;transition:background .3s}
.toggle.active{background:var(--teal)}
.toggle::after{content:"";width:16px;height:16px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:transform .3s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.active::after{transform:translateX(16px)}
.footer{text-align:center;padding:24px 0;margin-top:40px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3)}
.loading{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:13px}
.spinner{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.qty-input{width:70px;padding:6px 8px;background:var(--bg);border:1px solid
